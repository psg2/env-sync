name: CI

# Runs on every pull request. Pushes to main are covered by release.yml,
# which calls this workflow before publishing, so the checks run exactly
# once per event.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun test
      - name: Build
        run: bun run build
